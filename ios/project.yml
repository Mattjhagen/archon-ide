name: Archon
options:
  bundleIdPrefix: pro.relayapp
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    INFOPLIST_FILE: Archon/Info.plist
    CODE_SIGN_STYLE: Automatic
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    DEVELOPMENT_TEAM: ""
    ENABLE_PREVIEWS: true

targets:
  Archon:
    type: application
    platform: iOS
    sources:
      - path: Archon
        type: group
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pro.relayapp.archon
        INFOPLIST_FILE: Archon/Info.plist
        CODE_SIGN_ENTITLEMENTS: Archon/Archon.entitlements
    entitlements:
      path: Archon/Archon.entitlements
    info:
      path: Archon/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleURLTypes:
          - CFBundleURLName: pro.relayapp.archon
            CFBundleURLSchemes:
              - archon
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: true

  ArchonTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ArchonTests
        type: group
    dependencies:
      - target: Archon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pro.relayapp.archon.tests
